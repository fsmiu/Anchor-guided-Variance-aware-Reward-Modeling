# MeanVar + 2anchor (two binary thresholds) on HelpSteer3
run_name: "mv_2anchor_helpsteer3"
model_name: "NousResearch/Meta-Llama-3.1-8B-Instruct"
model_type: "meanvar"
dataset_name: "helpsteer3"

# Anchor config
anchor_method: "2anchor"
anchor_lambda: 0.1
anchor_tau1: "auto"  # will use 25th percentile of external RM scores
anchor_tau2: "auto"  # will use 75th percentile of external RM scores
anchor_model: "skywork-reward-v2-llama-3.1-8b"

# Data
train_data: "data/helpsteer3_train.json"
val_data: "data/helpsteer3_heldout.json"
test_data: "data/helpsteer3_heldout.json"

# Training
epochs: 2
per_device_batch_size: 16
per_device_eval_batch_size: 32
gradient_accumulation_steps: 1
learning_rate: 1e-5
lr_scheduler: "cosine"
warmup_ratio: 0.05
weight_decay: 1e-4
max_length: 2048

# Evaluation (for lambda tuning — compare eval/accuracy across runs)
eval_strategy: "steps"
eval_steps: 50

# Infrastructure
deepspeed: "configs/ds_config_zero2.json"
logging_steps: 50
report_to: "wandb"
